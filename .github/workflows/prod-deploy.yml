name: Production deploy

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Build and roll out on VPS
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/klendo-core' }}
          APP_PORT: ${{ vars.APP_PORT || '3000' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          port: ${{ vars.DEPLOY_PORT || '22' }}
          command_timeout: 20m
          envs: DEPLOY_SHA,DEPLOY_PATH,APP_PORT
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            test -f .env
            git diff --quiet
            git diff --cached --quiet
            git fetch origin master
            git checkout --detach "$DEPLOY_SHA"

            export IMAGE_TAG="$DEPLOY_SHA"
            export APP_PORT
            mkdir -p secrets

            docker compose build
            docker compose run --rm --no-deps migrate

            docker compose up -d --no-deps redis loki alloy grafana lb

            # API: new replicas start next to the old ones and take over once healthy (no downtime).
            bash scripts/deploy/rollout.sh api 180

            # Daily database backups: only where enabled (COMPOSE_PROFILES=backup in the server .env).
            if docker compose config --services | grep -qx backup; then
              docker compose up -d --no-deps --build backup
            fi

            # Crons run in a single worker: a short gap on restart is fine.
            if ! docker compose up -d --no-deps --wait --wait-timeout 180 worker; then
              docker compose logs --tail 100 worker
              exit 1
            fi
