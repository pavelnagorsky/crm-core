name: Production deploy

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Build and roll out on VPS
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/crm-core' }}
          APP_PORT: ${{ vars.APP_PORT || '3000' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          port: ${{ vars.DEPLOY_PORT || '22' }}
          command_timeout: 20m
          envs: DEPLOY_SHA,DEPLOY_PATH,APP_PORT
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            test -f .env
            git diff --quiet
            git diff --cached --quiet
            git fetch origin master
            git checkout --detach "$DEPLOY_SHA"

            export IMAGE_TAG="$DEPLOY_SHA"
            export APP_PORT
            mkdir -p secrets

            docker compose build
            docker compose run --rm --no-deps migrate

            docker compose up -d --no-deps redis loki alloy grafana lb

            # One service at a time: while one api restarts, lb serves the other.
            for service in api-1 api-2 worker; do
              if ! docker compose up -d --no-deps --wait --wait-timeout 180 "$service"; then
                docker compose logs --tail 100 "$service"
                exit 1
              fi
            done
