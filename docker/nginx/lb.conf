# Load balancer in front of the `api` replicas (API_REPLICAS of them).
# Docker DNS returns one address per replica for `api`; `resolve` re-reads the list every 5s, so replicas
# added or replaced by a rollout are picked up and removed ones dropped.
resolver 127.0.0.11 valid=5s;

map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

map $http_x_request_id $request_id_out {
  default $http_x_request_id;
  ''      $request_id;
}

# Real client IP. Requests come from the host nginx (through the docker port proxy, so from a private
# gateway address) or from containers in the compose network; both are trusted, and the client is the
# rightmost untrusted address in X-Forwarded-For. The host nginx must append to X-Forwarded-For
# ($proxy_add_x_forwarded_for) and, behind Cloudflare, restore the client IP itself first (real_ip_header
# CF-Connecting-IP), otherwise every client is limited as one Cloudflare edge address.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from fc00::/7;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Coarse per-IP limits, before a request costs a Node process and a Redis round trip. Fine-grained limits
# (per endpoint, per phone) live in the app: docs/rate-limiting.md.
# The auth zone covers sign-in style endpoints only: refresh and logout run on every session and an office
# behind one NAT would hit 10/min on them. An empty key is not limited.
map $uri $auth_limit_key {
  ~^/auth/(refresh|logout)$ '';
  ~^/auth/                  $binary_remote_addr;
  default                   '';
}

limit_req_zone  $binary_remote_addr zone=req_api:20m rate=30r/s;
limit_req_zone  $auth_limit_key     zone=req_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_ip:10m;
limit_req_status  429;
limit_conn_status 429;

upstream api {
  zone api 64k;
  server api:3000 resolve max_fails=1 fail_timeout=5s;
}

log_format lb '$remote_addr "$request" $status $body_bytes_sent '
                'rt=$request_time upstream=$upstream_addr requestId=$request_id_out';

server {
  listen 80;
  access_log /dev/stdout lb;
  error_log /dev/stderr warn;
  client_max_body_size 30m;

  limit_conn conn_ip 50;
  limit_req zone=req_api burst=60 nodelay;
  limit_req zone=req_auth burst=10 nodelay;

  location / {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Request-Id $request_id_out;
    # Stopped container: its IP is a black hole until DNS drops it (<=5s), so fail fast.
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
  }
}
