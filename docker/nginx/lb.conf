# Load balancer in front of api-1 / api-2.
# `resolve` re-resolves container IPs via Docker DNS, so recreated containers are picked up.
resolver 127.0.0.11 valid=5s;

map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

map $http_x_request_id $request_id_out {
  default $http_x_request_id;
  ''      $request_id;
}

upstream api {
  zone api 64k;
  server api-1:3000 resolve max_fails=1 fail_timeout=5s;
  server api-2:3000 resolve max_fails=1 fail_timeout=5s;
}

log_format lb '$remote_addr "$request" $status $body_bytes_sent '
                'rt=$request_time upstream=$upstream_addr requestId=$request_id_out';

server {
  listen 80;
  access_log /dev/stdout lb;
  error_log /dev/stderr warn;
  client_max_body_size 30m;

  location / {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Request-Id $request_id_out;
    # Stopped container: its IP is a black hole until DNS drops it (<=5s), so fail fast.
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
  }
}
