name: crm-core

x-app: &app
  image: crm-core:${IMAGE_TAG:-local}
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  mem_limit: 512m
  env_file: .env
  environment: &app-env
    DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://crm:crm@postgres:5432/crm}
    REDIS_URL: redis://redis:6379
    DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
    APP_ROLE: api
    # Empty: log to stdout only (collected by docker), no files.
    LOG_DIRECTORY: ''
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  volumes:
    - ./secrets:/run/secrets:ro
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: '3'

services:
  # Local only: on the server the database lives outside compose.
  postgres:
    image: postgres:17-alpine
    profiles: [local]
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    # 5433: 5432 is often taken by a Postgres installed on the host.
    ports:
      - 127.0.0.1:5433:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U crm -d crm]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Cache, rate limits and cron locks; nothing here needs to survive a restart.
  # volatile-lru evicts only keys with a TTL (cache entries), never cache tags.
  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
      - --save
      - ''
      - --appendonly
      - 'no'
    ports:
      - 127.0.0.1:6379:6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot: applies migrations. On the server Postgres lives outside compose.
  migrate:
    build:
      context: .
      target: migrate
    image: crm-core:${IMAGE_TAG:-local}-migrate
    env_file: .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://crm:crm@postgres:5432/crm}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: 'no'

  api-1:
    <<: *app
    build:
      context: .
      target: runtime

  api-2:
    <<: *app

  worker:
    <<: *app
    environment:
      <<: *app-env
      APP_ROLE: worker

  lb:
    image: nginx:1.28-alpine
    ports:
      - 127.0.0.1:${APP_PORT:-3000}:80
    volumes:
      - ./docker/nginx/lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-1
      - api-2
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
    restart: unless-stopped

volumes:
  postgres-data:
