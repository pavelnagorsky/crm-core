name: klendo-core

x-app: &app
  image: klendo-core:${IMAGE_TAG:-local}
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  mem_limit: 512m
  env_file: .env
  environment: &app-env
    DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://crm:crm@postgres:5432/crm}
    REDIS_URL: redis://redis:6379
    DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
    APP_ROLE: api
    # Key files from ./secrets are mounted at /run/secrets (same path in every environment).
    GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-credentials.json
    # Empty: log to stdout only (collected by docker), no files.
    LOG_DIRECTORY: ''
    # /metrics on its own port, reachable by prometheus over the compose network; never published or proxied by lb.
    METRICS_HOST: 0.0.0.0
    METRICS_PORT: 9464
  labels:
    prometheus.scrape: 'true'
    prometheus.port: '9464'
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  volumes:
    - ./secrets:/run/secrets:ro
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: '3'

services:
  # Local only: on the server the database lives outside compose.
  postgres:
    image: postgres:17-alpine
    profiles: [local]
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    # 5433: 5432 is often taken by a Postgres installed on the host.
    ports:
      - 127.0.0.1:5433:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U crm -d crm]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Cache, rate limits and cron locks; nothing here needs to survive a restart.
  # volatile-lru evicts only keys with a TTL (cache entries), never cache tags.
  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
      - --save
      - ''
      - --appendonly
      - 'no'
    ports:
      - 127.0.0.1:6379:6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot: applies migrations. On the server Postgres lives outside compose.
  migrate:
    build:
      context: .
      target: migrate
    image: klendo-core:${IMAGE_TAG:-local}-migrate
    env_file: .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://crm:crm@postgres:5432/crm}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: 'no'

  # HTTP API replicas. Count per server: API_REPLICAS in .env. lb reaches all of them via the `api` DNS name.
  # Deploys replace them without downtime with scripts/deploy/rollout.sh (compose itself restarts all at once).
  api:
    <<: *app
    build:
      context: .
      target: runtime
    deploy:
      replicas: ${API_REPLICAS:-2}

  worker:
    <<: *app
    environment:
      <<: *app-env
      APP_ROLE: worker

  lb:
    image: nginx:1.28-alpine
    ports:
      - 127.0.0.1:${APP_PORT:-3000}:80
    volumes:
      # The directory, not the file: git checkout replaces lb.conf with a new inode, which a single-file
      # bind mount would keep hiding. The deploy reloads nginx to apply a changed config.
      - ./docker/nginx:/etc/nginx/conf.d:ro
    depends_on:
      - api
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
    restart: unless-stopped

  # Logs: alloy reads container stdout via the docker socket, loki keeps it for 30 days,
  # grafana is the UI (dashboard "Klendo — логи" is provisioned). Never expose grafana publicly.
  loki:
    image: grafana/loki:3.6.22
    command: [-config.file=/etc/loki/loki.yaml]
    volumes:
      - ./docker/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    mem_limit: 384m
    logging: &log-rotation
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.22.0
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    mem_limit: 128m
    logging: *log-rotation
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.6
    # .env is the single source of the admin password: Grafana itself reads GF_SECURITY_ADMIN_PASSWORD only
    # when it creates its database, so the password is reset to it on every start. Without it only grafana fails.
    entrypoint:
      - sh
      - -c
      - |
        if [ -z "$$GF_SECURITY_ADMIN_PASSWORD" ]; then echo 'GRAFANA_ADMIN_PASSWORD is not set in .env' >&2; exit 1; fi
        printf '%s' "$$GF_SECURITY_ADMIN_PASSWORD" | grafana cli --homepath "$$GF_PATHS_HOME" --config "$$GF_PATHS_CONFIG" admin reset-admin-password --password-from-stdin cfg:default.paths.data="$$GF_PATHS_DATA" >/dev/null 2>&1 || true
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    ports:
      - 127.0.0.1:3200:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
      - prometheus
    mem_limit: 256m
    logging: *log-rotation
    restart: unless-stopped

  # Metrics (docs/metrics.md): prometheus scrapes api/worker (found via the docker socket) and the exporters,
  # keeps 30 days and at most 5 GB; grafana shows them. 127.0.0.1:9090 is for debugging queries only.
  prometheus:
    image: prom/prometheus:v3.16.0
    # The docker socket is readable by root only; the image runs as nobody by default.
    user: root
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
    ports:
      - 127.0.0.1:9090:9090
    volumes:
      # The directory, not the file: see lb.
      - ./docker/prometheus:/etc/prometheus:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - prometheus-data:/prometheus
    mem_limit: 512m
    logging: *log-rotation
    restart: unless-stopped

  # Connections, locks, database size. Server: POSTGRES_EXPORTER_DSN in .env (a role with pg_monitor, docs/metrics.md).
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.21.1
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN:-postgresql://crm:crm@postgres:5432/crm?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    mem_limit: 64m
    logging: *log-rotation
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.98.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      - redis
    mem_limit: 64m
    logging: *log-rotation
    restart: unless-stopped

  # Daily pg_dump to a private GCS bucket (docs/backups.md). Server only: enable with
  # COMPOSE_PROFILES=backup in .env; needs secrets/backup-gcs.json (create-only key) and BACKUP_BUCKET.
  # One-off backup: docker compose run --rm backup now
  backup:
    build: ./docker/backup
    image: klendo-core-backup:${IMAGE_TAG:-local}
    profiles: [backup]
    environment:
      BACKUP_DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://crm:crm@postgres:5432/crm}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-postgres}
      # Cron in TZ below: 03:30 Minsk, after the night crons and before the morning.
      BACKUP_CRON: ${BACKUP_CRON:-30 3 * * *}
      TZ: ${BACKUP_TZ:-Europe/Minsk}
      RCLONE_GCS_SERVICE_ACCOUNT_FILE: /run/secrets/backup-gcs.json
    volumes:
      - ./secrets/backup-gcs.json:/run/secrets/backup-gcs.json:ro
    mem_limit: 256m
    logging: *log-rotation
    restart: unless-stopped

volumes:
  postgres-data:
  loki-data:
  alloy-data:
  grafana-data:
  prometheus-data:
